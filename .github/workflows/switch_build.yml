name: Switch NRO Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      # 기존 devkita64 대신 모든 라이브러리가 포함된 devkitswitch 사용
      image: devkitpro/devkitswitch:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 차단당하는 라이브러리 다운로드 단계(dkp-pacman) 삭제

      - name: Compile NRO
        run: |
          cd 3guoheros/3gyjz-pc/desperate-angel-src/JYMINI
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-build-result
          path: 3guoheros/3gyjz-pc/desperate-angel-src/JYMINI/*.nro
