name: Switch NRO Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-switch:
    runs-on: ubuntu-latest
    container:
      # 원본 이미지로 복구 (이 안에 SDL2가 이미 다 들어있습니다)
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile NRO
        run: |
          cd 3guoheros/3gyjz-pc/desperate-angel-src/JYMINI
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: switch-build-result
          path: 3guoheros/3gyjz-pc/desperate-angel-src/JYMINI/*.nro
